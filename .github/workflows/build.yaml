name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "memory-bank/**"
      - "docs/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jhilkert90-wq/ml_heating_underfloor

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          CONFIG="ml_heating_underfloor/config.yaml"
          CURRENT=$(grep '^version:' "$CONFIG" | sed 's/version: *[\"]*\([^\"]*\)[\"]*$/\1/' | tr -d ' ')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          if ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to parse patch version from '${CURRENT}'"
            exit 1
          fi
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          sed -i "s/^version: *\"*${CURRENT}\"*/version: \"${NEW_VERSION}\"/" "$CONFIG"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped version: ${CURRENT} -> ${NEW_VERSION}"

      - name: Sync changelog to addon
        id: sync_changelog
        env:
          ADDON_CHANGELOG: ml_heating_underfloor/CHANGELOG.md
          MAIN_CHANGELOG: CHANGELOG.md
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          python3 <<'PY'
          import os
          from datetime import date
          from pathlib import Path

          addon_changelog = Path(os.environ["ADDON_CHANGELOG"])
          main_changelog = Path(os.environ["MAIN_CHANGELOG"])
          new_version = os.environ["NEW_VERSION"]
          today = date.today().isoformat()

          def set_output(name: str, value: str) -> None:
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
                  fh.write(f"{name}={value}\n")

          main_lines = main_changelog.read_text(encoding="utf-8").splitlines()

          try:
              unreleased_index = main_lines.index("## [Unreleased]")
          except ValueError:
              print("No [Unreleased] section found in main CHANGELOG.md — skipping addon changelog update.")
              set_output("changelog_updated", "false")
              raise SystemExit(0)

          next_version_index = len(main_lines)
          for i in range(unreleased_index + 1, len(main_lines)):
              if main_lines[i].startswith("## ["):
                  next_version_index = i
                  break

          unreleased_lines = main_lines[unreleased_index + 1:next_version_index]
          unreleased_body = "\n".join(unreleased_lines).strip()

          if not unreleased_body:
              print("No [Unreleased] entries found — skipping addon changelog update.")
              set_output("changelog_updated", "false")
              raise SystemExit(0)

          addon_lines = addon_changelog.read_text(encoding="utf-8").splitlines()
          title = addon_lines[0] if addon_lines else "# Changelog - ML Heating Underfloor"
          rest_lines = addon_lines[1:]
          while rest_lines and rest_lines[0] == "":
              rest_lines.pop(0)

          new_addon_lines = [
              title,
              "",
              f"## [{new_version}] - {today}",
              "",
              *unreleased_body.splitlines(),
              "",
          ]
          if rest_lines:
              new_addon_lines.extend(rest_lines)
          addon_changelog.write_text("\n".join(new_addon_lines).rstrip() + "\n", encoding="utf-8")

          new_main_lines = main_lines[:unreleased_index + 1] + [""] + main_lines[next_version_index:]
          main_changelog.write_text("\n".join(new_main_lines).rstrip() + "\n", encoding="utf-8")

          print(f"Moved [Unreleased] into addon changelog version {new_version}.")
          set_output("changelog_updated", "true")
          PY

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ml_heating_underfloor/config.yaml
          if [ "${{ steps.sync_changelog.outputs.changelog_updated }}" = "true" ]; then
            git add CHANGELOG.md
            git add ml_heating_underfloor/CHANGELOG.md
          fi
          git commit -m "Bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

  build:
    needs: bump-version
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm   # Native ARM runner, no QEMU
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}     # Runner selected from matrix

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main                   # Ensure latest pushed bump commit is fetched

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # No QEMU needed; each job runs natively on its architecture

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ needs.bump-version.outputs.version }}" ]]; then
            echo "version=${{ needs.bump-version.outputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^version:' ml_heating_underfloor/config.yaml | sed 's/version: *[\"]*\([^\"]*\)[\"]*$/\1/' | tr -d ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:latest
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_DESCRIPTION=ML Heating Underfloor
            BUILD_NAME=ML Heating Underfloor
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}   # Separate cache per architecture
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  test-image:
    name: Smoke-test built image (amd64)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image version
        id: version
        run: |
          if [[ -n "${{ needs.build.outputs.version }}" ]]; then
            echo "version=${{ needs.build.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep '^version:' ml_heating_underfloor/config.yaml | sed 's/version: *[\"]*\([^\"]*\)[\"]*$/\1/' | tr -d ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull amd64 image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-amd64:${{ steps.version.outputs.version }}

      - name: Check OCI / HA add-on labels
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-amd64:${{ steps.version.outputs.version }}"
          EXPECTED="${{ steps.version.outputs.version }}"

          HA_TYPE=$(docker inspect "$IMAGE" --format '{{ index .Config.Labels "io.hass.type" }}')
          HA_VER=$(docker inspect "$IMAGE" --format '{{ index .Config.Labels "io.hass.version" }}')
          OCI_VER=$(docker inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')

          echo "io.hass.type    = ${HA_TYPE}"
          echo "io.hass.version = ${HA_VER}"
          echo "oci.version     = ${OCI_VER}"

          [[ "${HA_TYPE}" == "addon" ]]       || { echo "::error::io.hass.type is not 'addon'"; exit 1; }
          [[ "${HA_VER}"  == "${EXPECTED}" ]] || { echo "::error::io.hass.version '${HA_VER}' != '${EXPECTED}'"; exit 1; }
          [[ "${OCI_VER}" == "${EXPECTED}" ]] || { echo "::error::org.opencontainers.image.version '${OCI_VER}' != '${EXPECTED}'"; exit 1; }
          echo "✅ Labels OK"

      - name: ML dependency smoke test
        run: |
          docker run --rm \
            --entrypoint python3 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-amd64:${{ steps.version.outputs.version }} \
            -c "import lightgbm, pandas, numpy, sklearn, streamlit; print('ML deps OK')"

      - name: Core module smoke test
        run: |
          docker run --rm \
            --entrypoint python3 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-amd64:${{ steps.version.outputs.version }} \
            -c "import sys; sys.path.insert(0,'/app'); from src.config import CYCLE_INTERVAL_MINUTES; from src.thermal_equilibrium_model import ThermalEquilibriumModel; from src.model_wrapper import EnhancedModelWrapper; print('Core modules OK')"

      - name: Config adapter smoke test
        run: |
          docker run --rm \
            --entrypoint python3 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-amd64:${{ steps.version.outputs.version }} \
            -c "import sys; sys.path.insert(0,'/app'); from config_adapter import convert_addon_to_env; print('Config adapter OK')"

      - name: Required files check
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-amd64:${{ steps.version.outputs.version }}"
          for f in /app/run.sh /app/validate_container.py /app/src/main.py /app/config_adapter.py; do
            docker run --rm --entrypoint test "$IMAGE" -f "$f" \
              && echo "✅ $f exists" \
              || { echo "::error::Required file missing: $f"; exit 1; }
          done

  create-release:
    name: Create GitHub Release
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (full history + tags)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' ml_heating_underfloor/config.yaml \
            | sed 's/version: *[\"]*\([^\"]*\)[\"]*$/\1/' | tr -d ' ')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from addon changelog
        if: steps.tag_check.outputs.exists == 'false'
        id: notes
        run: |
          NOTES=$(python3 scripts/extract_changelog_notes.py ml_heating_underfloor/CHANGELOG.md || true)
          if [[ -z "$NOTES" ]]; then
            NOTES="Release ${{ steps.version.outputs.version }}"
          fi
          # Write to file to avoid shell quoting issues with multi-line content
          printf '%s' "$NOTES" > /tmp/release_notes.md
          echo "Release notes written ($(wc -l < /tmp/release_notes.md) lines)"

      - name: Create and push git tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release_notes.md \
            --latest \
            --target main
